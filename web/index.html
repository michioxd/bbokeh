<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>bbokeh</title>
    </head>
    <body>
        <div id="app">
            <div class="menu" id="sidebar">
                <div
                    class="handler"
                    role="separator"
                    tabindex="0"
                    aria-label="Resize sidebar"
                    aria-orientation="vertical"
                    aria-controls="sidebar-content"
                ></div>

                <div class="content" id="sidebar-content">
                    <form class="content-inner" id="preview-settings">
                        <p>
                            we miss a legend! -
                            <a href="https://github.com/michioxd/bbokeh" target="_blank" rel="noopener noreferrer">
                                bbokeh
                            </a>
                            by
                            <a href="https://github.com/michioxd" target="_blank" rel="noopener noreferrer">michioxd</a>
                        </p>
                        <div class="btn-group">
                            <button id="restart" type="button" disabled>Restart</button>
                            <button id="playback" type="button" disabled>Pause</button>
                            <button id="fullscreen" type="button" disabled>Fullscreen</button>
                        </div>
                        <div class="btn-group" role="group" aria-label="Frame navigation">
                            <button type="button" data-step="-10" aria-label="Back 10 frames" disabled>&lt;&lt;</button>
                            <button type="button" data-step="-1" aria-label="Previous frame" disabled>&lt;</button>
                            <button type="button" data-step="1" aria-label="Next frame" disabled>&gt;</button>
                            <button type="button" data-step="10" aria-label="Forward 10 frames" disabled>
                                &gt;&gt;
                            </button>
                        </div>
                        <p id="fullscreen-status" role="status"></p>

                        <div class="input-group">
                            <label for="scr-ort">Screen orientation</label>
                            <select name="scr-ort" id="scr-ort">
                                <option value="portrait">Portrait</option>
                                <option value="landscape" selected>Landscape</option>
                            </select>
                        </div>

                        <label><input id="scr-fit" type="checkbox" checked /> Fit to viewport</label>
                        <label><input id="scr-logo" type="checkbox" checked /> Show logo</label>

                        <div class="input-group">
                            <label for="scr-variant">Variant</label>
                            <select name="scr-variant" id="scr-variant" disabled>
                                <option value="playbook">BlackBerry PlayBook</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="scr-rat">Ratio</label>
                            <select name="scr-rat" id="scr-rat" disabled>
                                <option value="128:75">128:75</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="scr-spd">Animation speed</label>
                            <div class="range-container">
                                <input
                                    type="range"
                                    name="scr-spd"
                                    id="scr-spd"
                                    min="0.1"
                                    max="10"
                                    step="0.1"
                                    value="1"
                                />
                                <output class="range-value" for="scr-spd" id="scr-spd-label">1x</output>
                            </div>
                        </div>

                        <label><input id="scr-loop" type="checkbox" checked /> Loop forever</label>

                        <div class="input-group">
                            <label for="scr-duration">Spotlight duration (seconds)</label>
                            <input id="scr-duration" type="number" min="0" step="0.1" required />
                        </div>

                        <div class="input-group">
                            <label for="scr-delay">Replay delay (seconds)</label>
                            <input id="scr-delay" type="number" min="0" step="0.1" required />
                        </div>

                        <button id="reset-settings" type="button">Reset settings</button>
                    </form>
                </div>
            </div>
            <div class="main" tabindex="-1">
                <canvas id="canvas"></canvas>
                <button id="exit-fullscreen" type="button">Exit fullscreen</button>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
